"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 3
final_space = true

[palette]
black = "#16181a"
red = "#ff6e5e"
green = "#4bd37f"
yellow = "#f1ff87"
blue = "#5ea1ff"
magenta = "#bd5eff"
cyan = "#5ef1ff"
white = "#e0e0e0"
bright_black = "#3c4048"
bright_red = "#ff6e5e"
bright_green = "#4bd37f"
bright_yellow = "#f1ff87"
bright_blue = "#5ea1ff"
bright_magenta = "#bd5eff"
bright_cyan = "#5ef1ff"
bright_white = "#ffffff"
text = "#e0e0e0"

[[blocks]]
type = "prompt"
alignment = "left"

[[blocks.segments]]
type = "session"
style = "powerline"
background = "p:blue"
foreground = "p:text"
powerline_symbol = ""
template = "  {{ .UserName }}"

[[blocks.segments]]
type = "path"
style = "powerline"
background = "p:green"
foreground = "p:black"
powerline_symbol = ""
template = " {{ .Path }}"

[blocks.segments.properties]
folder_icon = "\uf07b"
home_icon = "~"
style = "agnoster_short"

[[blocks.segments]]
type = "git"
style = "powerline"
background = "p:magenta"
foreground = "p:black"
powerline_symbol = ""
template = " {{ .HEAD }}"

[blocks.segments.properties]
branch_icon = ""
display_status = true
fetch_status = true


[[blocks]]
type = "rprompt"
overflow = "hidden"

[[blocks.segments]]
type = "executiontime"
style = "plain"
background = "transparent"
foreground = "p:text"
template = "{{ .FormattedMs }}"

[blocks.segments.properties]
threshold = 5000


[transient_prompt]
background = "transparent"
foreground = "p:bright_blue"
template = " "
